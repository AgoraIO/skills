name: Skills Quality Review

on:
  workflow_dispatch:
    inputs:
      skill_path:
        description: "Path to skill to evaluate (relative to skills-repo)"
        required: false
        default: "skills/agora"
      eval_ref:
        description: "agentic-evals ref (branch/tag/SHA; default pinned in .github/eval-pin.env)"
        required: false
        default: ""

  pull_request:
    paths:
      - "skills/**/*.md"
      - ".github/workflows/**"

jobs:
  judge:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout skills repo
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: skills-repo

      - name: Setup eval harness
        uses: ./skills-repo/.github/actions/setup-eval-harness
        with:
          eval_repo: AgoraIO/agentic-evals
          eval_ref: ${{ github.event.inputs.eval_ref || '' }}

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Build judge prompt
        env:
          SKILL_PATH: ${{ github.event.inputs.skill_path || 'skills/agora' }}
        run: |
          # Map skills-repo path to agentic-evals path
          EVAL_SKILL_PATH="agentic-evals/.agents/skills/agora"

          SKILL_FILES=$(find "$EVAL_SKILL_PATH" -name "SKILL.md" -type f | sort)
          FILE_COUNT=$(echo "$SKILL_FILES" | grep -c . || echo 0)

          cat > /tmp/judge-prompt.txt << HEREDOC
          You have the skill-judge skill loaded. Use it now.

          Evaluate ALL SKILL.md files under ${EVAL_SKILL_PATH}. There are ${FILE_COUNT} SKILL.md files.

          For each SKILL.md:
          1. Read the file completely.
          2. Follow the skill-judge evaluation protocol (all 8 dimensions).
          3. Generate the full structured report.

          After evaluating each file, write a combined report to skill-judge-report.md with:
          - Summary table of all skills with scores and grades.
          - Individual evaluation reports.
          - "Cross-Skill Observations" section.
          - "Priority Improvements" with top 5 highest-impact changes.

          Files to evaluate:
          $(echo "$SKILL_FILES" | while read f; do echo "- $f"; done)

          Write the report to skill-judge-report.md in the current directory.
          HEREDOC

      - name: Run Codex judge with stream-safe retry
        id: run_judge
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESPONSES_API_ENDPOINT: ${{ secrets.RESPONSES_API_ENDPOINT }}
          MODEL: gpt-5.4
        run: |
          set -e
          mkdir -p "$HOME/.codex"
          base_url="${RESPONSES_API_ENDPOINT%/responses}"
          base_url="${base_url%/}/v1"
          cat > "$HOME/.codex/config.toml" << EOF
          model_provider = "OpenAI"
          model = "${MODEL}"
          disable_response_storage = true

          [model_providers.OpenAI]
          name = "OpenAI"
          base_url = "${base_url}"
          wire_api = "responses"
          requires_openai_auth = true
          EOF
          if [ -n "$OPENAI_API_KEY" ]; then
            cat > "$HOME/.codex/auth.json" << EOF
          {"auth_mode":"apikey","OPENAI_API_KEY":"${OPENAI_API_KEY}"}
          EOF
          fi

          run_codex_once() {
            local log_file="$1"
            codex exec --skip-git-repo-check --sandbox danger-full-access \
              --output-last-message /tmp/skill-judge-report.md < /tmp/judge-prompt.txt \
              > "${log_file}" 2>&1
          }

          attempt=1
          first_rc=0
          run_codex_once "/tmp/codex-judge-attempt-1.log" || first_rc=$?

          if [ "$first_rc" -ne 0 ] && \
            grep -E "stream disconnected|stream closed before response\\.completed" \
            "/tmp/codex-judge-attempt-1.log" >/dev/null 2>&1; then
            echo "Detected stream-disconnect on attempt 1, retrying once."
            attempt=2
            second_rc=0
            run_codex_once "/tmp/codex-judge-attempt-2.log" || second_rc=$?
            final_rc="$second_rc"
          else
            final_rc="$first_rc"
          fi

          if [ "$final_rc" -ne 0 ]; then
            echo "::error::Codex judge failed (response stream disconnect or endpoint issue). Re-run workflow or check RESPONSES_API_ENDPOINT."
            if [ "$attempt" -eq 1 ]; then
              cat /tmp/codex-judge-attempt-1.log
            else
              cat /tmp/codex-judge-attempt-2.log
            fi
            exit 1
          fi

      - name: Upload report
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: skill-judge-report-${{ github.run_id }}
          path: skill-judge-report.md
          retention-days: 30
          if-no-files-found: warn

      - name: Post report to job summary
        if: always() && github.event_name != 'pull_request'
        run: |
          if [ -f skill-judge-report.md ]; then
            echo "## Skill Quality Review" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat skill-judge-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Post PR comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync('skill-judge-report.md')) return;
            const report = fs.readFileSync('skill-judge-report.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## Skill Quality Review\n\n${report}\n\n---\n[View run](${process.env.RUN_URL})`,
            });

      - name: Notify Feishu
        if: always() && github.event_name != 'pull_request'
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          RUN_DIR: .
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: python3 agentic-evals/scripts/notify_feishu.py || true
